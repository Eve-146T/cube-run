<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17283b">
  <title>Suggest a Cube Run achievement</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #17283b;
      color: #f8fbff;
    }
    main {
      width: min(100%, 520px);
      padding: 30px;
      border: 2px solid #ffd35a;
      border-radius: 24px;
      background: #263950;
      box-shadow: 0 12px 0 #0d1926;
    }
    .eyebrow { margin: 0 0 10px; color: #ffd35a; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.4rem); line-height: .98; }
    p { margin: 18px 0 0; color: #dce8f3; font-size: 1.1rem; line-height: 1.55; }
    .prompt {
      margin-top: 24px;
      padding: 16px 18px;
      border-radius: 16px;
      background: #122235;
      color: #fff;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Cube Run</p>
    <h1>Suggest an achievement</h1>
    <p>Got a ridiculous challenge the game should reward?</p>
    <div class="prompt">Tell us its name, challenge, and reward in the feedback panel.</div>
  </main>
</body>
</html>
