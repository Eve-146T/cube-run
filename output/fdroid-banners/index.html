<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Run · Banner concepts</title><style>*{box-sizing:border-box}body{margin:0;background:#10121a;color:#f7f7fb;font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:32px 24px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px}h1{font-size:28px;margin:0}header p{color:#aaaebf;margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}article{background:#1a1d28;border:1px solid #333748;border-radius:12px;overflow:hidden}img{display:block;width:100%;aspect-ratio:1024/500;object-fit:contain;background:#111}a{color:inherit}article>a{display:block}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px}h2{font-size:18px;margin:0}.download{padding:12px 16px;border:1px solid #53596f;border-radius:8px;text-decoration:none;font-size:14px}.download:hover{background:#31374b}dialog{border:1px solid #555b70;padding:12px;background:#10121a;color:white;max-width:96vw;width:1280px}dialog::backdrop{background:#000c}dialog img{width:100%}button{display:block;margin:12px 0 0 auto;padding:12px 22px;color:white;background:#30374c;border:0;border-radius:6px;font:inherit;cursor:pointer}@media(max-width:760px){.grid{grid-template-columns:1fr}header{display:block}header p{margin-top:10px}main{padding:24px 16px}}</style><main><header><h1>Cube Run / Banner concepts</h1><p>6 directions · Click to enlarge · Choose a number to refine</p></header><div class="grid" id="grid"></div></main><dialog id="preview"><img id="large" alt=""><button onclick="preview.close()">Close</button></dialog><script>const concepts=[['01-portal','01 · Portal rush'],['02-track','02 · Into the run'],['03-minimal','03 · Pure cube'],['04-candy','04 · Candy sprint'],['05-speed','05 · Full throttle'],['06-isometric','06 · Pocket world']];const grid=document.querySelector('#grid');for(const [id,name]of concepts){const card=document.createElement('article');card.innerHTML=`<a href="${id}.png" aria-label="Enlarge ${name}"><img src="${id}.png" alt="${name}"></a><footer><h2>${name}</h2><a class="download" href="${id}.png" download>Download PNG</a></footer>`;card.querySelector('a').onclick=e=>{e.preventDefault();document.querySelector('#large').src=id+'.png';document.querySelector('#large').alt=name;document.querySelector('#preview').showModal()};grid.append(card)}document.querySelector('dialog').onclick=e=>{if(e.target.tagName==='DIALOG')e.target.close()};</script></html>
