<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Run · Biome banners</title><style>*{box-sizing:border-box}body{margin:0;background:#10121a;color:#f7f7fb;font:16px system-ui}main{max-width:1440px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{margin:0;font-size:28px}nav{display:flex;gap:8px}button,a.download{font:inherit;color:inherit;background:#252b3e;border:1px solid #505974;border-radius:8px;padding:12px 18px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#e8efff;color:#151a28}section{margin-top:30px}h2{font-size:20px;margin:0 0 12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#1a1e2b;border:1px solid #353c52;border-radius:10px;overflow:hidden}img.banner{display:block;width:100%;aspect-ratio:1024/500;object-fit:contain}figure>a{display:block}figcaption{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}.reference{margin-top:12px;color:#b6bfd5}.reference img{width:160px;max-height:340px;object-fit:contain;margin-top:12px}dialog{padding:12px;background:#10121a;color:white;border:1px solid #555;max-width:96vw;width:1400px}dialog::backdrop{background:#000c}dialog img{width:100%}dialog button{display:block;margin:12px 0 0 auto}.hidden{display:none}@media(max-width:760px){.pair{grid-template-columns:1fr}main{padding:24px 12px}h1{font-size:24px}}</style><main><header><h1>Cube Run / Biome banners</h1><nav aria-label="Text filter"><button aria-pressed="true" onclick="filter('all',this)">Both</button><button aria-pressed="false" onclick="filter('title',this)">With title</button><button aria-pressed="false" onclick="filter('clean',this)">No text</button></nav></header><div id="gallery"></div><details class="reference"><summary>Original concept 02</summary><a href="original.png"><img style="width:100%;max-height:none" src="original.png" alt="Original banner concept 02"></a></details></main><dialog id="preview"><img id="large" alt=""><button onclick="document.querySelector('#preview').close()">Close</button></dialog><script>const biomes=[['01-candy','01 · Candy Fields',0],['02-city','02 · Neon City',1],['03-lava','03 · Lava Caves',2],['04-frost','04 · Frost Peaks',3],['05-dunes','05 · Sunset Dunes',4],['06-space','06 · Deep Space',5]];for(const[id,name,n]of biomes){const section=document.createElement('section');section.innerHTML='<h2>'+name+'</h2><div class="pair"></div><details class="reference"><summary>Gameplay reference captured on phone</summary><a href="biome-'+n+'.png"><img src="biome-'+n+'.png" alt="'+name+' gameplay screenshot"></a></details>';for(const[kind,label]of [['title','With title'],['clean','No text']]){const figure=document.createElement('figure');figure.dataset.kind=kind;const file=id+'-'+kind+'.png';figure.innerHTML='<a href="'+file+'"><img class="banner" src="'+file+'" alt="'+name+' — '+label+'"></a><figcaption><span>'+label+'</span><a class="download" href="'+file+'" download>Download PNG</a></figcaption>';figure.querySelector('a').onclick=e=>{e.preventDefault();const img=document.querySelector('#large');img.src=file;img.alt=name+' — '+label;document.querySelector('#preview').showModal()};section.querySelector('.pair').append(figure)}document.querySelector('#gallery').append(section)}function filter(kind,button){document.querySelectorAll('figure').forEach(f=>f.classList.toggle('hidden',kind!=='all'&&f.dataset.kind!==kind));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b===button));document.querySelectorAll('.pair').forEach(p=>p.style.gridTemplateColumns=kind==='all'?'':'1fr')}document.querySelector('dialog').onclick=e=>{if(e.target.tagName==='DIALOG')e.target.close()};</script></html>
