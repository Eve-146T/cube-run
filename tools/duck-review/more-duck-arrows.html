<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Run · More duck arrows</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111318;color:#f0f1f5;font:15px system-ui,sans-serif}main{max-width:1800px;margin:auto;padding:28px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:27px;letter-spacing:-.7px;margin:0 0 8px}p{color:#a9afbd;margin:0;line-height:1.5}a{color:#bdc8e8}nav{display:flex;gap:8px;margin:24px 0}button{font:inherit;cursor:pointer;color:inherit;background:#22262e;border:1px solid #383e4b;border-radius:8px;min-height:44px;padding:10px 17px}button[aria-pressed=true]{background:#e7ecfa;color:#151922;border-color:#e7ecfa}button:focus-visible,a:focus-visible{outline:3px solid #8db4ff;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}article h2{font-size:16px;margin:0 0 10px;font-weight:650}.shot{display:block;padding:0;width:100%;overflow:hidden;border:1px solid #343b49;border-radius:8px;background:#080a10}.shot img{width:100%;display:block;aspect-ratio:1080/2340}.note{font-size:13px;margin-top:12px}footer{margin-top:22px;font-size:13px;color:#919aab}dialog{padding:12px;background:#111318;color:white;border:1px solid #525c70;border-radius:12px;max-width:96vw;max-height:96vh}dialog::backdrop{background:#000d}dialog img{display:block;max-height:80vh;max-width:88vw;margin:12px auto 0}dialog header{gap:30px}dialog h2{margin:0;font-size:18px}dialog button{padding:6px 15px}@media(min-width:1500px){.grid{max-width:1540px;margin:auto}.shot img{max-height:65vh;object-fit:contain}article h2{text-align:center}}@media(max-width:850px){main{padding:20px 16px}header{align-items:flex-start;flex-direction:column;gap:8px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 10px}nav{flex-wrap:wrap}h1{font-size:24px}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px}.worlds{display:flex;gap:8px}@media(max-width:850px){.controls{flex-wrap:wrap;margin:18px 0}nav{margin:0}}
</style>
<main>
<header><div><h1>More duck arrows</h1><p>Five new treatments beside the current version. Duck obstacles only.</p></div><a href="https://github.com/Eve-146T/cube-run/issues/16">Issue #16 ↗</a></header>
<div class="controls"><nav aria-label="Comparison scene"></nav><div class="worlds" role="group" aria-label="World"><button data-world="0">Candy Fields</button><button data-world="1">Neon City</button></div></div>
<section class="grid" aria-label="Current duck arrows and five new candidates"></section>
<footer>Native game captures · Same scene and camera for every version · Select an image to enlarge</footer>
</main>
<dialog><header><h2></h2><button aria-label="Close enlarged image">Close</button></header><img alt=""></dialog>
<script>
const styles=[['Current','Pale beveled chevrons.',6],['1 · Double','Two compact chevrons stacked on each lane.',7],['2 · Center','One large chevron in the middle of the bar.',8],['3 · Down arrows','A solid arrowhead and short stem.',9],['4 · Inset','Dark chevrons with a pale lower edge.',10],['5 · Lower tips','Small arrowheads along the bottom of the bar.',11]];
const scenes=[['duck','Duck approach'],['jump','Jump approach'],['hills','Rolling hills'],['moving','Moving + partial bars']];
const nav=document.querySelector('nav'),grid=document.querySelector('.grid'),dialog=document.querySelector('dialog');
const params=new URLSearchParams(location.search);let current=params.get('scene')||'duck';let world=params.get('world')==='1'?'1':'0';
document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{world=b.dataset.world;show(current)});
for(const [id,label] of scenes){const button=document.createElement('button');button.textContent=label;button.dataset.scene=id;button.onclick=()=>show(id);nav.append(button)}
function show(scene){current=scene;document.querySelectorAll('[data-world]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.world===world));nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===scene));grid.replaceChildren();styles.forEach(([name,note,i])=>{const card=document.createElement('article');const h=document.createElement('h2');h.textContent=name;const b=document.createElement('button');b.className='shot';b.setAttribute('aria-label','Enlarge '+name);const img=document.createElement('img');img.src=`assets/${world}-${i}-${scene}.png`;img.alt=`${name} — ${scenes.find(s=>s[0]===scene)[1]}`;b.append(img);b.onclick=()=>{dialog.querySelector('h2').textContent=img.alt;dialog.querySelector('img').src=img.src;dialog.querySelector('img').alt=img.alt;dialog.showModal()};const p=document.createElement('p');p.className='note';p.textContent=note;card.append(h,b,p);grid.append(card)});}
dialog.querySelector('button').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});show(current);
</script>
</html>
