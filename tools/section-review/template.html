<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube Run · Section review</title>
<style>
:root{font:16px system-ui,sans-serif;color:#241d39;background:#f5f2ea;--ink:#241d39;--line:#dcd6e5;--purple:#7044cc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:9px 15px;font-weight:650}button:hover{border-color:var(--purple)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9064e8;outline-offset:2px}.primary{background:var(--ink);color:white;border-color:var(--ink)}header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);background:white}header strong{font-size:20px;margin-right:auto}header small{color:#686071}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);height:calc(100dvh - 81px)}aside{border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:10px;min-height:0}input,select,textarea{border:1px solid var(--line);background:white;border-radius:9px;padding:11px;color:var(--ink)}aside input,aside select{min-width:0;width:100%}#catalog{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:5px}.section{text-align:left;display:flex;align-items:center;gap:10px;background:transparent;border-color:transparent;flex-shrink:0}.section.active{background:#e6dcfa;border-color:#c9b4ee}.section .id{font-size:12px;color:#726881;min-width:23px}.section .dot{margin-left:auto;width:8px;height:8px;flex-shrink:0;border-radius:50%;background:#cec8d7}.section.reviewed .dot{background:#32916a}.section.flagged .dot{background:#d24d40}main{overflow:auto;padding:26px clamp(20px,4vw,64px)}.title{display:flex;align-items:center;gap:12px;margin-bottom:20px}.title h1{font-size:clamp(23px,3vw,36px);margin:0;text-transform:capitalize;line-height:1.1}.title .sub{font-size:13px;color:#746a7f;margin-top:7px}.nav{margin-left:auto;display:flex;gap:7px}.content{display:grid;grid-template-columns:minmax(165px,240px) minmax(300px,570px);gap:32px;align-items:start}.preview{background:#e8e0f4;border-radius:18px;padding:18px;display:flex;justify-content:center;min-height:350px}svg{max-height:470px;width:100%;overflow:visible}.legend{font-size:12px;color:#766b80;margin-top:10px;line-height:1.6}.form{display:flex;flex-direction:column;gap:20px}fieldset{padding:0;border:0;margin:0;min-width:0}legend,.label{display:block;font-weight:700;margin:0 0 9px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choices button{font-size:14px;flex:1;padding:10px 11px}.choices button[aria-pressed=true]{background:#e6dcfa;border-color:var(--purple);color:#4b2799}.tags button{flex:0 1 auto;font-weight:500;background:transparent}.boost{display:flex;align-items:center;gap:12px}.boost input{flex:1;min-width:80px;padding:0;accent-color:#7044cc}.arrows{display:flex;gap:3px}.arrow{width:15px;height:19px;clip-path:polygon(0 45%,50% 0,100% 45%,100% 80%,50% 38%,0 80%);background:#d4cbdc}.speed{font-size:13px;color:#70647d;margin-top:7px}textarea{width:100%;min-height:100px;resize:vertical;line-height:1.5}details{font-size:13px;color:#6f617d;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-weight:650}#status{font-size:13px;min-height:18px;color:#5b4a72}#empty{padding:20px;font-size:14px;color:#746a7f}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center}#next{min-width:140px}.hint{font-size:12px;color:#746a7f}#boostValue{min-width:20px;font-weight:700}@media(max-width:850px){header{padding:12px;flex-wrap:wrap;gap:7px}header strong{font-size:17px}header button{font-size:13px;padding:8px}.layout{grid-template-columns:185px 1fr;height:calc(100dvh - 73px)}aside{padding:10px}.content{grid-template-columns:1fr;gap:20px}.preview{min-height:0;padding:12px;max-height:180px}.preview svg{height:156px}main{padding:20px}.legend{display:none}}@media(max-width:560px){.layout{display:flex;flex-direction:column;height:auto}aside{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}#catalog{grid-column:1/-1;flex-direction:row;max-height:62px}.section{white-space:nowrap}main{overflow:visible;padding:20px 16px}.title{margin-bottom:16px}.title h1{font-size:25px}.content{gap:18px}header small{display:none}.preview{max-height:150px}.preview svg{height:126px}.form{gap:18px}textarea{min-height:85px}}
</style>
<header><strong>Cube Run · Sections</strong><small id="progress"></small><button id="export">Export</button><button id="send" class="primary">Send feedback</button></header>
<div class="layout"><aside><input id="search" type="search" placeholder="Find section or ID" aria-label="Find section"><select id="filter" aria-label="Filter sections"><option value="all">All sections</option><option value="unrated">Not rated</option><option value="flagged">Needs work</option><option value="reviewed">Rated</option></select><nav id="catalog" aria-label="Sections"></nav></aside>
<main><div class="title"><div><h1 id="name"></h1><div class="sub" id="meta"></div></div><div class="nav"><button id="prev" aria-label="Previous section">←</button><button id="forward" aria-label="Next section">→</button></div></div><div class="content"><div><div class="preview" id="preview"></div><div class="legend">Bottom → top · authored pattern<br>Lane order may mirror during play.</div></div><div class="form">
<fieldset><legend>Boosts</legend><div class="boost"><span id="boostValue">5</span><input id="boost" type="range" min="0" max="10" value="5" aria-label="Boost count"><div class="arrows" id="arrows" aria-hidden="true"></div></div><div class="speed" id="speed"></div></fieldset>
<fieldset><legend>How does it feel?</legend><div class="choices" id="feel"></div></fieldset>
<fieldset><legend>Skill needed</legend><div class="choices" id="skill"></div></fieldset>
<fieldset><legend>What needs work?</legend><div class="choices tags" id="issues"></div></fieldset>
<label><span class="label">Notes</span><textarea id="notes" placeholder="Which move or transition? What would make it better?"></textarea></label>
<div class="footer"><span id="status" role="status" aria-live="polite"></span><button id="next" class="primary">Next unrated →</button></div>
<details><summary>Bot reference</summary><div id="bot"></div></details>
</div></div></main></div>
<script>
'use strict';
const sections=/*SECTION_DATA*/[];
const $=id=>document.getElementById(id), storageKey='cube-run-section-review-v1';
let reviews={},current=sections[0].id,boost=5;
try{reviews=JSON.parse(localStorage.getItem(storageKey)||'{}');if(!reviews||typeof reviews!=='object'||Array.isArray(reviews))reviews={}}catch{reviews={}}
const feels=['Great','Good','Okay','Frustrating','Broken'],skills=['Easy','Moderate','Hard','Expert'],issues=['Too tight','Unclear','Repetitive','Too empty','Unfair join','Lags'];
function record(){return reviews[current]?.[boost]||{feel:'',skill:'',issues:[],notes:''}}
function states(id){return Object.values(reviews[id]||{})}
function rated(id){return states(id).some(r=>r.feel)}
function flagged(id){return states(id).some(r=>['Frustrating','Broken'].includes(r.feel)||(r.issues||[]).length)}
function save(change){reviews[current]??={};reviews[current][boost]={...record(),...change,updated:new Date().toISOString()};try{localStorage.setItem(storageKey,JSON.stringify(reviews));$('status').textContent='Saved'}catch{$('status').textContent='Storage unavailable — export your ratings'}renderCatalog()}
function choice(group,values,key,multi=false){const root=$(group);root.replaceChildren();for(const v of values){const b=document.createElement('button');b.textContent=v;const chosen=multi?(record()[key]||[]).includes(v):record()[key]===v;b.setAttribute('aria-pressed',String(chosen));b.onclick=()=>{const old=record()[key]||[];save({[key]:multi?(chosen?old.filter(x=>x!==v):[...old,v]):(chosen?'':v)});renderForm()};root.append(b)}}
function renderForm(){choice('feel',feels,'feel');choice('skill',skills,'skill');choice('issues',issues,'issues',true);$('notes').value=record().notes||'';$('boost').value=boost;$('boostValue').textContent=boost;const diff=boost<=5?.12+(.58-.12)*boost/5:.58+(1-.58)*(boost-5)/5;const speed=diff<=.85?10+20*diff:27+3*(1-Math.pow((1-diff)/.15,2));$('speed').textContent=`Opening speed ${speed.toFixed(1)}${boost>5?' · Dev mode':''}`;$('arrows').replaceChildren();for(let i=0;i<5;i++){const a=document.createElement('span');a.className='arrow';if(i<boost)a.style.background=boost>5&&i<boost-5?'#287be8':'#ff8a3d';$('arrows').append(a)}}
function renderCatalog(){const query=$('search').value.toLowerCase(),filter=$('filter').value;const nav=$('catalog');nav.replaceChildren();for(const s of sections){if(!`${s.id} ${s.name}`.toLowerCase().includes(query))continue;if(filter==='unrated'&&rated(s.id)||filter==='flagged'&&!flagged(s.id)||filter==='reviewed'&&!rated(s.id))continue;const b=document.createElement('button');b.className=`section ${s.id===current?'active':''} ${rated(s.id)?'reviewed':''} ${flagged(s.id)?'flagged':''}`;b.setAttribute('aria-current',String(s.id===current));const id=document.createElement('span');id.className='id';id.textContent=s.id;const name=document.createElement('span');name.textContent=s.name.toLowerCase();const dot=document.createElement('span');dot.className='dot';b.append(id,name,dot);b.onclick=()=>select(s.id);nav.append(b)}if(!nav.children.length){const e=document.createElement('div');e.id='empty';e.textContent='No matching sections';nav.append(e)}$('progress').textContent=`${sections.filter(s=>rated(s.id)).length} / ${sections.length} rated`}
function preview(s){const colors=['#f8f5fd','#f27fbc','#73cc4b','#a071de','#322942','#59b9d4','#ecca51','#748ddb','#e59254','#b4a1dd','#e77d66','#e9bc39','#54b68d','#bb695e','#b47eb7'];const names=['Open','Pillar','Jump wall','Duck bar','Tar','Piston','Sweeper','Stomper','Slider','Platform','Pincer','Coins','Bounce pad','Tall wall','Pendulum'];let svg=`<svg role="img" aria-label="${s.name} pattern" viewBox="0 0 174 ${s.rows.length*35+18}" xmlns="http://www.w3.org/2000/svg">`;s.rows.slice().reverse().forEach((row,j)=>row.forEach((kind,i)=>{const x=i*58+3,y=j*35+5;svg+=`<g><title>${names[kind]}</title><rect x="${x}" y="${y}" width="52" height="29" rx="5" fill="${colors[kind]}" stroke="#c7bbd6"/>`;if(kind===3)svg+=`<path d="M${x+8} ${y+7}h36" stroke="#fff" stroke-width="4"/>`;else if(kind===2||kind===13)svg+=`<path d="M${x+10} ${y+21}l16-13 16 13" fill="none" stroke="#fff" stroke-width="3"/>`;else if(kind===11)svg+=`<circle cx="${x+26}" cy="${y+14}" r="7" fill="#fff0b4"/>`;else if(kind===12)svg+=`<path d="M${x+9} ${y+20}h34m-27-5 10-10 10 10" fill="none" stroke="#fff" stroke-width="3"/>`;svg+='</g>'}));$('preview').innerHTML=svg+'</svg>'}
function select(id){current=id;const s=sections.find(s=>s.id===id);$('name').textContent=s.name.toLowerCase();$('meta').textContent=`Section ${s.id} · ${s.id<0?'Warm-up / bonus pattern':`Tier ${s.tier}`} · ${s.rows.length} rows`;$('status').textContent='';renderCatalog();renderForm();preview(s);const b=s.bot;$('bot').textContent=b?`${b.rating_at_30} at speed 30. Perfect-input highest sampled all-pass speed: ${b.perfect_highest_all_pass>=90?'≥':''}${b.perfect_highest_all_pass}. These are estimates from the earlier 60 Hz survey, not human ratings or an impossibility proof.`:'No bot reference yet.'}
function move(dir){select(sections[(sections.findIndex(s=>s.id===current)+dir+sections.length)%sections.length].id)}
$('prev').onclick=()=>move(-1);$('forward').onclick=()=>move(1);$('search').oninput=renderCatalog;$('filter').onchange=renderCatalog;$('boost').oninput=e=>{boost=Number(e.target.value);renderForm();$('status').textContent=''};$('notes').oninput=e=>save({notes:e.target.value});$('next').onclick=()=>{const start=sections.findIndex(s=>s.id===current);for(let n=1;n<=sections.length;n++){const s=sections[(start+n)%sections.length];if(!rated(s.id)){select(s.id);return}}$('status').textContent='All sections rated'};
function payload(){return {schema:1,game:'cube-run',created:new Date().toISOString(),sections:sections.filter(s=>states(s.id).length).map(s=>({id:s.id,name:s.name,ratings:reviews[s.id]}))}}
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='cube-run-section-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('send').onclick=async()=>{if(!payload().sections.length){$('status').textContent='Rate a section first';return}const path=location.pathname;let id=path.match(/\/drops\/[^/]+\/[^/]+\/([^/]+)/)?.[1];if(!id){try{id=new URL(document.referrer).pathname.match(/\/d\/([^/]+)/)?.[1]}catch{}}if(!id){$('status').textContent='Open the shared page to send, or use Export';return}$('send').disabled=true;try{const response=await fetch(`/api/drops/${encodeURIComponent(id)}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:'Cube Run section feedback\n'+JSON.stringify(payload(),null,2)})});if(!response.ok)throw Error(response.status);$('status').textContent='Feedback sent'}catch{$('status').textContent='Could not send — your ratings are still saved. Use Export.'}finally{$('send').disabled=false}};
select(current);
</script></html>
