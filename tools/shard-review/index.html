<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube Run · Shard layouts</title>
<style>
:root{font-family:system-ui,sans-serif;color:#f6f2ff;background:#171329;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header,main{max-width:1300px;margin:auto;padding:28px 24px}h1{font-size:clamp(26px,4vw,40px);margin:0 0 12px;letter-spacing:-1px}p{color:#c8c0df;line-height:1.5;margin:0}button{font:inherit;cursor:pointer;border:1px solid #65577f;color:white;background:#2b2341;border-radius:12px;padding:12px 16px;min-height:46px}button:hover{background:#403151}button:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}.toolbar button[aria-pressed=true]{background:#c9b3ff;color:#2b1f5e;border-color:#c9b3ff}.toolbar span{margin-left:auto;color:#ffd23f;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.option{border:2px solid #3b3154;background:#221b35;border-radius:20px;overflow:hidden}.option.selected{border-color:#ffd23f}.option h2{font-size:18px;margin:0;padding:18px}.option h2 span{color:#c9b3ff;margin-right:8px}.shot{display:block;width:100%;aspect-ratio:720/1520;object-fit:contain;background:#130c29}.controls{display:flex;gap:10px;padding:14px}.controls button{flex:1}.controls .pick{background:#c9b3ff;color:#2b1f5e;border:0;font-weight:700}.note{font-size:14px;min-height:100px;padding:0 16px 20px}dialog{background:#171329;color:white;border:1px solid #65577f;border-radius:16px;max-width:95vw;max-height:97vh;padding:14px}dialog::backdrop{background:#08050edb}dialog img{display:block;max-height:82vh;max-width:85vw;margin-top:12px}dialog button{display:block;margin-left:auto}@media(max-width:800px){.grid{grid-template-columns:1fr;max-width:390px;margin:auto}header,main{padding:22px 16px}.note{min-height:0}.toolbar span{margin-left:0}}
</style>
<header><h1>Three ways to show shards</h1><p>Native wardrobe screens, with matching unlock button sizes. Compare collection progress and the ready-to-unlock state.</p><div class="toolbar"><button data-state="progress" aria-pressed="true">33/100 shards</button><button data-state="ready" aria-pressed="false">Ready to unlock</button><span id="selection">Choose the closest version</span></div></header>
<main><div class="grid" id="grid"></div></main>
<dialog id="zoom"><button id="close">Close</button><img alt="Full-size shard layout" id="large"></dialog>
<script>
const options=[['In the cube','The count is part of the cube. At 100 it changes to READY, and the unlock button appears.'],['Under the name','A compact progress line and a small bar, using the wardrobe’s existing outlined text.'],['Shard pill','A small white shard pill below the cube, matching the coin balance.']];
let state='progress',selected=null;try{const saved=localStorage.getItem('shard-choice');if(saved!==null)selected=Number(saved)}catch{}
const grid=document.querySelector('#grid'),zoom=document.querySelector('#zoom');
function render(){grid.replaceChildren();options.forEach(([name,note],i)=>{const card=document.createElement('article');card.className='option'+(selected===i?' selected':'');const src=`assets/frost-${i}-${state}.png`;card.innerHTML=`<h2><span>${i+1}.</span>${name}</h2><img class="shot" src="${src}" alt="${name}, ${state==='progress'?'33 of 100 Frost shards':'ready to unlock'}"><div class="controls"><button class="view">View</button><button class="pick">${selected===i?'Selected':'Pick this'}</button></div><p class="note">${note}</p>`;card.querySelector('.view').onclick=()=>{document.querySelector('#large').src=src;zoom.showModal()};card.querySelector('.pick').onclick=()=>{selected=i;try{localStorage.setItem('shard-choice',i)}catch{};render()};grid.append(card)});document.querySelector('#selection').textContent=selected===null?'Choose the closest version':`Selected: ${selected+1}. ${options[selected][0]}`;document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===state)))}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});document.querySelector('#close').onclick=()=>zoom.close();zoom.onclick=e=>{if(e.target===zoom)zoom.close()};render();
</script>
</html>
